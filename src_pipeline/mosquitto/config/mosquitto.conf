# Konfiguration for Mosquitto (MQTT-broker).
# Utan denna fil vagrar Mosquitto v2 slappa in nagon utifran.

# Lyssna pa port 1883 - MQTT:s standardport.
listener 1883

# Tillat anslutningar utan anvandarnamn och losenord.
# OK for en lokal prototyp. Skulle aldrig gora sa i skarp drift.
allow_anonymous true